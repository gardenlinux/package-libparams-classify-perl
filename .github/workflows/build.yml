on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  build:
    uses: gardenlinux/package-build/.github/workflows/build.yml@main
    with:
      release: ${{ github.ref == 'refs/heads/main' }}
      build_dep: |
        gardenlinux/package-perl 5.42.2-3gl0+bp1877
        gardenlinux/package-libb-hooks-op-check-perl 0.22-3gl0+bp1877
        gardenlinux/package-libdevel-callchecker-perl 0.009-2gl0+bp1877
